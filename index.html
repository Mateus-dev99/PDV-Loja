<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>PDV Loja</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script></script>
<body>
    <header>
        <h1>PDV Loja - Anderson</h1>
        <p>Sistema de vendas e controle de produtos</p>
        <p id="info-clima">Carregando clima...</p>
    </header>
    <main>
        <section id="produtos">
            <h2>Produtos</h2>

        <label for="busca">Buscar produto:</label>
        <input
        type="search"
        id="busca"
        placeholder="Nome ou código de barras"
        >

    <button type="button">Buscar</button>
    <div id="resultado-busca"></div>
    

        </section>
        <section id="carrinho">
        <h2>Carrinho de vendas</h2>

        <div id="itens-carrinho">
            <p>Nenhum produto adicionado.</p>
        </div>
        
        <p>Total: <span id="total">R$ 0,00</span></p>

        <button type="button">Finalizar venda</button>
    </section>
    </main>


    <!-- Biblioteca do SQLite -->
     <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

     <!-- Seu código -->
    <script src="script.js"></script>

</body>
</html>
